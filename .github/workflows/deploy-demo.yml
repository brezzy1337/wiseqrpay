# CI/CD for the demo: every push to `demo` rebuilds the container and rolls the
# existing Cloud Run service to it.
#
# Auth is keyless (Workload Identity Federation): the OIDC provider's attribute
# condition only trusts tokens from this repository, and the github-deployer
# service account holds least-privilege roles (run.developer, repo-scoped
# artifactregistry.writer, actAs the runtime SA). The values below are resource
# identifiers, not secrets.
#
# Deliberately NO database migration step: the live schema is managed manually
# via `prisma db push` through cloud-sql-proxy (see infra/README.md) — the
# checked-in migrations are stale and `migrate deploy` would fail against the
# live database.
name: Deploy demo to Cloud Run

on:
  push:
    branches: [demo]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# One deploy at a time; queue (don't cancel) so every merged commit ships.
concurrency:
  group: deploy-demo
  cancel-in-progress: false

env:
  PROJECT_ID: golden-hologram-465409-p1
  REGION: asia-southeast1
  SERVICE: wiseqrpay
  IMAGE_BASE: asia-southeast1-docker.pkg.dev/golden-hologram-465409-p1/wiseqrpay/wiseqrpay

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.smoke.outputs.url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (OIDC / WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/290796524365/locations/global/workloadIdentityPools/github/providers/github
          service_account: github-deployer@golden-hologram-465409-p1.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Artifact Registry auth
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          docker build -t "${IMAGE_BASE}:${GITHUB_SHA}" -t "${IMAGE_BASE}:latest" .
          docker push "${IMAGE_BASE}:${GITHUB_SHA}"
          docker push "${IMAGE_BASE}:latest"

      - name: Deploy to Cloud Run
        # Image-only update: env vars, secrets, Cloud SQL attachment, and the
        # runtime service account stay as Terraform (infra/) configured them.
        run: |
          gcloud run deploy "$SERVICE" \
            --image "${IMAGE_BASE}:${GITHUB_SHA}" \
            --region "$REGION" \
            --quiet

      - name: Smoke check
        id: smoke
        run: |
          URL=$(gcloud run services describe "$SERVICE" --region "$REGION" --format="value(status.url)")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/")
          echo "GET $URL/ -> $code"
          test "$code" = "200"

  # Post-deploy e2e: the public scan→pay storyline against the revision that
  # just went live (specs tagged @live; the auth-dependent onboarding spec
  # skips itself on remote targets). Catches what a curl can't — e.g. the
  # schema-drift 500 on /pay/[id] that a 200 on / sailed past.
  #
  # Deliberately a SEPARATE job with no id-token permission and no gcloud:
  # npm ci runs lifecycle scripts (prisma generate postinstall), and those must
  # never execute in an environment holding the deployer's GCP credentials.
  e2e:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run live e2e suite
        env:
          E2E_BASE_URL: ${{ needs.deploy.outputs.url }}
        run: npm run test:e2e:live
